asr:
  model: large-v3
  device: auto
  compute_type: auto
  beam_size: 5
  vad_filter: false
  # VAD may remove short speech; keep disabled for highest recall.

translation:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  batch_size: 20
  temperature: 0.2

ass:
  play_res_x: 1920
  play_res_y: 1080
  japanese_font: Noto Sans JP
  chinese_font: Noto Sans CJK SC
  japanese_size: 44
  chinese_size: 42
